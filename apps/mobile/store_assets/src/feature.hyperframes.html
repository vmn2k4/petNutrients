<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=1024, height=500"><style>
*{margin:0;box-sizing:border-box}html,body{width:1024px;height:500px;overflow:hidden;font-family:Inter,system-ui,sans-serif}
#root{position:relative;width:1024px;height:500px;overflow:hidden;background:radial-gradient(110% 120% at 90% 0%,#FFE680 0%,#FFD21F 55%,#F5B800 100%)}
.ic{position:absolute;left:60px;top:48px;width:72px;height:72px;border-radius:18px;box-shadow:0 8px 18px rgba(16,38,46,.3)}
h1{position:absolute;left:60px;top:146px;font-size:62px;font-weight:900;line-height:1.04;letter-spacing:-1.5px;color:#10262e}
h1 em{font-style:normal;display:inline-block;background:#10262e;color:#FFD21F;padding:0 16px 4px;border-radius:14px;margin-top:6px}
.s{position:absolute;left:60px;top:352px;font-size:25px;font-weight:700;color:#10262e;width:470px;line-height:1.3}
.b{position:absolute;left:60px;top:424px;display:flex;gap:10px}.b span{background:#fff;color:#10262e;font-weight:900;font-size:17px;padding:8px 16px;border-radius:24px;box-shadow:0 3px 0 #10262e}
.ph{position:absolute;width:236px;padding:7px;border-radius:34px;background:#10262e;box-shadow:0 0 0 2px #3c5560,0 20px 40px rgba(16,38,46,.45)}
.ph div{height:420px;border-radius:27px;overflow:hidden;background:#FFD21F}.ph img{width:100%;display:block}
.ph.a img{height:100%;width:auto;display:block;margin:0 auto}
</style></head><body><div id="root" data-composition-id="main" data-start="0" data-duration="2" data-width="1024" data-height="500">

<div class="s">Daily calories, food nutrition &amp; growth for dogs and cats</div>
<div class="b"><span>FREE TO START</span><span>DOGS &amp; CATS</span></div>
<div class="ph a" style="left:600px;top:70px;transform:rotate(-5deg)"><div><img src="src/android_home.png"></div></div>
<div class="ph" style="left:780px;top:96px;transform:rotate(5deg)"><div><img src="src/web_foods.png"></div></div>
</div></div></body></html>
